<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Shahidullah Kaisar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body>

<div class="wrap">
  <div class="page-head">
    <p class="eyebrow">Blog</p>
    <h1>Writing</h1>
    <p class="lead">Research notes, things I'm learning, and pieces of student life.</p>
  </div>

  <section>
    <!-- filter buttons — they work automatically -->
    <div class="filters">
      <button class="on" data-filter="all">All</button>
      <button data-filter="research">Research</button>
      <button data-filter="learning">Learning</button>
      <button data-filter="life">Student life</button>
    </div>
    <p class="count"></p>

    <div class="grid-2">

      <!-- ══════════════════════════════════════════════════════════
           ✏️ TO ADD A POST: copy one whole <a class="card rv" …>…</a>
           block and put it at the TOP (newest first).
             • href       → the file you made in the blog/ folder
             • data-cat   → research | learning | life  (drives the filters)
             • the <span class="tag"> is just the label shown on the card
           ══════════════════════════════════════════════════════════ -->

      <a class="card rv" data-cat="research" href="blog/z-scan-explained.html">
        <span class="tag">Research · 10 Jul 2026</span>
        <h3>What a Z-scan curve actually tells you</h3>
        <p>Peak–valley or valley–peak? The experiment behind my thesis, explained simply.</p>
      </a>

      <!-- example of a "life" post — replace with a real one, or delete
      <a class="card rv" data-cat="life" href="blog/first-semester.html">
        <span class="tag">Student life · 01 Aug 2026</span>
        <h3>Title of the post</h3>
        <p>One-line teaser.</p>
      </a>
      -->

    </div>
  </section>
</div>
</body>
</html>
