<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery 📸 Shahidullah Kaisar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Nunito:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body>

<div class="page-hero wrap">
  <p class="eyebrow">gallery</p>
  <h1>Through my lens 📸</h1>
  <!-- ✏️ EDIT: intro line -->
  <p class="lead">Nature, friends, and everything in between. Click any photo to see it big.</p>
</div>

<section>
  <div class="wrap">
    <div class="masonry">
      <!-- ✏️ EDIT: YOUR PHOTOS.
           1. Upload photos to the repo folder: images/gallery/
           2. Copy one <figure> line per photo — change the file name + caption.
           Any photo size works, the grid arranges itself.
           Missing photos hide automatically (no broken images). -->
      <figure class="shot rv"><img src="images/gallery/photo1.jpg" alt="" loading="lazy"><figcaption>🌿 caption for photo 1</figcaption></figure>
      <figure class="shot rv"><img src="images/gallery/photo2.jpg" alt="" loading="lazy"><figcaption>📷 caption for photo 2</figcaption></figure>
      <figure class="shot rv"><img src="images/gallery/photo3.jpg" alt="" loading="lazy"><figcaption>🍃 caption for photo 3</figcaption></figure>
      <figure class="shot rv"><img src="images/gallery/photo4.jpg" alt="" loading="lazy"><figcaption>👥 caption for photo 4</figcaption></figure>
      <figure class="shot rv"><img src="images/gallery/photo5.jpg" alt="" loading="lazy"><figcaption>🌄 caption for photo 5</figcaption></figure>
      <figure class="shot rv"><img src="images/gallery/photo6.jpg" alt="" loading="lazy"><figcaption>☕ caption for photo 6</figcaption></figure>
    </div>
  </div>
</section>

</body>
</html>
