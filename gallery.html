<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — Shahidullah Kaisar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body>

<div class="wrap">
  <div class="page-head">
    <p class="eyebrow">Photos</p>
    <h1>Photography</h1>
    <p class="lead">Nature, friends, campus and the lab. Click any photo to open it.</p>
  </div>

  <section>
    <div class="filters">
      <button class="on" data-filter="all">All</button>
      <button data-filter="nature">Nature</button>
      <button data-filter="people">People</button>
      <button data-filter="campus">Campus &amp; lab</button>
      <button data-filter="travel">Travel</button>
    </div>
    <p class="count"></p>

    <div class="masonry">

      <!-- ══════════════════════════════════════════════════════════
           ✏️ TO ADD A PHOTO:
           1. Upload the image to the repo folder  images/gallery/
              (simple names, no spaces: sunset.jpg, friends-trip.jpg …)
           2. Copy ONE line below and change three things:
                data-cat  → nature | people | campus | travel
                src       → images/gallery/YOUR-FILE.jpg
                caption   → the text under the photo
           Any size works. A missing file is hidden automatically.
           ══════════════════════════════════════════════════════════ -->

      <figure class="shot rv" data-cat="nature"><img src="images/gallery/photo1.jpg" alt="" loading="lazy"><figcaption>Caption for photo 1</figcaption></figure>
      <figure class="shot rv" data-cat="nature"><img src="images/gallery/photo2.jpg" alt="" loading="lazy"><figcaption>Caption for photo 2</figcaption></figure>
      <figure class="shot rv" data-cat="people"><img src="images/gallery/photo3.jpg" alt="" loading="lazy"><figcaption>Caption for photo 3</figcaption></figure>
      <figure class="shot rv" data-cat="people"><img src="images/gallery/photo4.jpg" alt="" loading="lazy"><figcaption>Caption for photo 4</figcaption></figure>
      <figure class="shot rv" data-cat="campus"><img src="images/gallery/photo5.jpg" alt="" loading="lazy"><figcaption>Caption for photo 5</figcaption></figure>
      <figure class="shot rv" data-cat="travel"><img src="images/gallery/photo6.jpg" alt="" loading="lazy"><figcaption>Caption for photo 6</figcaption></figure>

    </div>
  </section>
</div>
</body>
</html>
